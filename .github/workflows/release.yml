name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
      - name: Verify official Proma capabilities
        shell: pwsh
        run: ./scripts/ci-compatibility.ps1
      - run: npm run release
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME release/*.zip release/*.tgz release/SHA256SUMS.txt --verify-tag --generate-notes
